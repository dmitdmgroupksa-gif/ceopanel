services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ceopanel_test
      POSTGRES_DB: ceopanel_test
      POSTGRES_PASSWORD: disposable_test_only
    ports: ["127.0.0.1::5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceopanel_test -d ceopanel_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1::6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
